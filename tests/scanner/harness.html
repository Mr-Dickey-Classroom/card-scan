<!doctype html><html><head><meta charset="utf-8"><title>Scanner harness</title></head><body>
<canvas id="c"></canvas>
<script type="module">
// Ported from reference/scanner-tests/test.html. Draws synthetic classroom photos and runs the
// app's real detector (src/detect.js) on them. Random numbers are seeded so every run is the same.
import CODES from "/reference/card-codes.json";
import { detectMulti, angleToLetter } from "/src/detect.js";

let seed = 1;
function rand() { // mulberry32
  seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + rand() * (b - a);

function drawMarker(ctx, id, x, y, s) { // s = marker side incl. black border
  const code = CODES[id].toString(2).padStart(16, "0"), u = s / 6;
  ctx.fillStyle = "#000"; ctx.fillRect(x, y, s, s);
  ctx.fillStyle = "#fff";
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++)
    if (code[i * 4 + j] === "1") ctx.fillRect(x + (j + 1) * u, y + (i + 1) * u, u + 0.5, u + 0.5);
}

async function scene({ W = 3000, H = 2000, n = 35, smin = 22, smax = 140, jitter = 25, shear = 0.25, blur = 1, quality = 0.8, tiltOnly = null }) {
  const cv = document.getElementById("c"); cv.width = W; cv.height = H;
  const ctx = cv.getContext("2d", { willReadFrequently: true });
  const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#8a8f7a"); g.addColorStop(1, "#3d4038");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let k = 0; k < 60; k++) { ctx.fillStyle = `hsl(${rnd(0, 360)},${rnd(5, 40)}%,${rnd(15, 75)}%)`; ctx.fillRect(rnd(0, W), rnd(0, H), rnd(20, 300), rnd(20, 300)); }
  const truth = [], placed = [];
  const ids = [...Array(CODES.length).keys()].sort(() => rand() - 0.5).slice(0, n);
  for (const id of ids) {
    const s = rnd(smin, smax), card = s * 1.6;
    let x, y, tries = 0;
    do { x = rnd(card, W - card); y = rnd(card, H - card); tries++; } while (placed.some(p => Math.hypot(p.x - x, p.y - y) < (p.r + card) * 0.8) && tries < 300);
    if (tries >= 300) continue;
    placed.push({ x, y, r: card });
    const q = Math.floor(rnd(0, 4)), off = tiltOnly ?? rnd(-jitter, jitter), rotDeg = q * 90 + off;
    ctx.save(); ctx.translate(x, y); ctx.rotate(rotDeg * Math.PI / 180);
    if (tiltOnly === null) ctx.transform(1, rnd(-shear, shear) * 0.4, rnd(-shear, shear), 1 - rnd(0, shear), 0, 0);
    ctx.fillStyle = "#f4f2ec"; ctx.fillRect(-card / 2, -card / 2, card, card);
    drawMarker(ctx, id, -s / 2, -s / 2, s);
    ctx.restore();
    // canvas rotation of +90° (clockwise) moves the A edge to the right, so D is on top
    truth.push({ id, letter: ["A", "D", "C", "B"][q], s: Math.round(s) });
  }
  if (blur) { const tmp = document.createElement("canvas"); tmp.width = W; tmp.height = H; const t = tmp.getContext("2d"); t.filter = `blur(${blur}px)`; t.drawImage(cv, 0, 0); ctx.drawImage(tmp, 0, 0); }
  const img = new Image(); img.src = cv.toDataURL("image/jpeg", quality); await img.decode();
  ctx.drawImage(img, 0, 0);
  return { canvas: cv, truth };
}

// One synthetic photo → counts. `missed` lists marker sizes (px) that weren't read.
window.runScene = async (opts) => {
  seed = opts.seed ?? 1;
  const { canvas, truth } = await scene(opts);
  const t0 = performance.now();
  const found = detectMulti(canvas);
  const ms = performance.now() - t0;
  const byId = {}; for (const m of found) byId[m.card - 1] = angleToLetter(m.angle);
  let ok = 0, wrong = 0, tilted = 0; const missed = [];
  for (const t of truth) {
    if (!(t.id in byId)) { missed.push(t.s); continue; }
    if (byId[t.id] === null) { tilted++; continue; }
    if (byId[t.id] === t.letter) ok++; else wrong++;
  }
  const truthIds = new Set(truth.map(t => t.id));
  const phantom = Object.keys(byId).filter(k => !truthIds.has(+k)).length;
  return { n: truth.length, ok, wrong, tilted, phantom, missed: missed.sort((a, b) => a - b), ms: Math.round(ms) };
};

// A real photo → { card: letter-or-null }.
window.runPhoto = async (url) => {
  const img = new Image(); img.src = url; await img.decode();
  const c = document.getElementById("c"); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext("2d", { willReadFrequently: true }).drawImage(img, 0, 0);
  const out = {};
  for (const m of detectMulti(c)) out[m.card] = angleToLetter(m.angle);
  return out;
};
window.ready = true;
</script></body></html>
