<title>STCS Card Scan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: phone-first single column — scoreboard-style header with class chips, tabbed work area below. */
:root {
  --paper: #f6f5ef; --card: #ffffff; --ink: #16180f; --muted: #5d6152; --line: #dcdcd0;
  --green: #1d5b34; --green-2: #2f7a4a; --yellow: #f3c623; --yellow-ink: #3a2f00;
  --ok: #1f7a43; --ok-bg: #dff1e5; --bad: #b2361d; --bad-bg: #fbe3dc; --warn-bg: #fff4cc; --none: #e9e8df;
  --c7: #1f4e79; --c8: #2f7a4a; --cearth: #8a5a2b; --cjh: #127a7a;
  --display: "Barlow Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #11130e; --card: #1b1e16; --ink: #eef0e4; --muted: #a3a893; --line: #30342a;
  --green: #2f7a4a; --green-2: #4f9e69; --yellow: #f3c623; --yellow-ink: #2a2200;
  --ok: #6fd193; --ok-bg: #193624; --bad: #ff8b6e; --bad-bg: #3d1d15; --warn-bg: #3a3212; --none: #262a20;
  --c7: #6ea6d9; --c8: #6fc08a; --cearth: #d09a63; --cjh: #5cc4c4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #11130e; --card: #1b1e16; --ink: #eef0e4; --muted: #a3a893; --line: #30342a;
  --green: #2f7a4a; --green-2: #4f9e69; --yellow: #f3c623; --yellow-ink: #2a2200;
  --ok: #6fd193; --ok-bg: #193624; --bad: #ff8b6e; --bad-bg: #3d1d15; --warn-bg: #3a3212; --none: #262a20;
  --c7: #6ea6d9; --c8: #6fc08a; --cearth: #d09a63; --cjh: #5cc4c4; color-scheme: dark; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--paper); color: var(--ink); font: 16px/1.45 var(--body); margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: #16180f; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
.wrap { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #16180f; color: #f6f5ef; }
header.top .wrap { padding-block: 10px 0; display: grid; gap: 8px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font: 800 26px/1 var(--display); letter-spacing: .02em; margin: 0; text-transform: uppercase; }
.brand h1 span { color: #f3c623; }
.brand .sync { font-size: 12px; color: #c9cbb8; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid #3a3e30; background: #22251b; color: #e6e8da; border-radius: 999px; padding: 6px 14px; font: 700 15px/1.2 var(--display); letter-spacing: .04em; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.chip i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chip[aria-pressed="true"] { background: #f3c623; color: #2a2200; border-color: #f3c623; }
nav.tabs { display: grid; grid-template-columns: repeat(4, 1fr); border-top: 1px solid #2c3024; }
nav.tabs button { background: none; border: 0; color: #c9cbb8; padding: 10px 2px 9px; font: 700 15px/1 var(--display); letter-spacing: .03em; white-space: nowrap; text-transform: uppercase; border-bottom: 3px solid transparent; }
nav.tabs button[aria-selected="true"] { color: #fff; border-bottom-color: #f3c623; }

main .wrap { padding-block: 18px 60px; display: grid; gap: 16px; }
h2 { font: 800 28px/1.05 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .01em; text-wrap: balance; }
h3 { font: 700 19px/1.2 var(--display); margin: 0; text-transform: uppercase; letter-spacing: .04em; }
.sub { color: var(--muted); font-size: 14px; margin: 0; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 9px 14px; font-weight: 700; }
.btn.primary { background: var(--yellow); color: var(--yellow-ink); border-color: var(--yellow); }
.btn.dark { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .5; cursor: default; }
.scanbtn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 16px; font: 800 24px/1 var(--display); letter-spacing: .05em; text-transform: uppercase; background: var(--yellow); color: var(--yellow-ink); border: 0; border-radius: 12px; }
.scanbtn svg { width: 28px; height: 28px; }
input[type=text], input[type=date], input[type=number], textarea, select { width: 100%; border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 9px 11px; }
textarea { min-height: 120px; resize: vertical; }
label.f { display: grid; gap: 4px; font-size: 14px; color: var(--muted); min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.note { border-radius: 8px; padding: 10px 12px; font-size: 15px; background: var(--warn-bg); }
.note.info { background: var(--none); }
.empty { text-align: center; padding: 28px 12px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty b { color: var(--ink); font: 700 20px/1.2 var(--display); text-transform: uppercase; letter-spacing: .03em; }

.setlist { display: grid; gap: 10px; }
.setitem { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; width: 100%; }
.datebox { width: 54px; text-align: center; border-radius: 8px; background: var(--none); padding: 6px 0; font-family: var(--display); line-height: 1; }
.datebox .d { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.datebox .n { font-size: 26px; font-weight: 800; }
.setitem .t { font-weight: 700; }
.setitem .m { color: var(--muted); font-size: 14px; }
.pct { font: 800 24px/1 var(--display); font-variant-numeric: tabular-nums; text-align: right; }
.pct small { display: block; font: 400 12px/1.2 var(--body); color: var(--muted); }

.qpills { display: flex; gap: 6px; flex-wrap: wrap; }
.qpill { min-width: 52px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 10px; font: 700 17px/1 var(--display); letter-spacing: .04em; display: grid; gap: 4px; justify-items: center; }
.qpill .bar { width: 100%; height: 4px; border-radius: 2px; background: var(--none); overflow: hidden; }
.qpill .bar span { display: block; height: 100%; background: var(--green-2); }
.qpill[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.letters { display: flex; gap: 6px; }
.letter { width: 44px; height: 44px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font: 800 22px/1 var(--display); }
.letter[aria-pressed="true"] { background: var(--green); color: #fff; border-color: var(--green); }
.letter.any { width: auto; padding: 0 12px; font-size: 15px; letter-spacing: .04em; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--none); border-radius: 8px; padding: 8px 10px; }
.stat .v { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.stat .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.roster { display: grid; gap: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; background: var(--card); }
.srow { display: grid; grid-template-columns: 38px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); min-height: 52px; }
.srow:first-child { border-top: 0; }
.srow .card { font: 700 15px/1 var(--display); color: var(--muted); font-variant-numeric: tabular-nums; }
.srow .name { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.ans { min-width: 44px; height: 36px; border-radius: 8px; display: inline-grid; place-items: center; font: 800 20px/1 var(--display); border: 0; padding: 0 10px; background: var(--none); color: var(--muted); }
.ans.ok { background: var(--ok-bg); color: var(--ok); }
.ans.bad { background: var(--bad-bg); color: var(--bad); }
.ans.any { background: var(--ok-bg); color: var(--ok); }
.picker { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; padding-bottom: 4px; }
.photo { position: relative; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.photo canvas { display: block; width: 100%; height: auto; }

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: var(--r); background: var(--card); }
table { border-collapse: collapse; width: 100%; font-size: 14px; font-variant-numeric: tabular-nums; }
th, td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
th { font: 700 14px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--muted); background: var(--none); position: sticky; top: 0; }
td.n, th.n { text-align: left; position: sticky; left: 0; background: var(--card); }
th.n { background: var(--none); }
td.lo { color: var(--bad); font-weight: 700; }
tr.avg td { font-weight: 700; background: var(--none); }
.check { display: flex; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); }
.check:first-child { border-top: 0; }
.check input { width: 20px; height: 20px; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 10px 16px; border-radius: 999px; font-weight: 700; z-index: 20; max-width: calc(100% - 32px); }
.busy { position: fixed; inset: 0; background: rgba(10,12,8,.72); color: #fff; display: grid; place-items: center; z-index: 30; font: 800 26px/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; text-align: center; padding: 20px; }
@media (prefers-reduced-motion: no-preference) { .busy span { animation: pulse 1s ease-in-out infinite alternate; } @keyframes pulse { from { opacity: .55 } to { opacity: 1 } } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand"><h1>STCS <span>Card Scan</span></h1><div class="sync" id="sync">Loading…</div></div>
    <div class="chips" id="chips" role="group" aria-label="Class"></div>
  </div>
  <nav class="tabs wrap" id="tabs" role="tablist" aria-label="Sections">
    <button role="tab" data-tab="sets" aria-selected="true">Bell work</button>
    <button role="tab" data-tab="roster" aria-selected="false">Roster</button>
    <button role="tab" data-tab="reports" aria-selected="false">Reports</button>
    <button role="tab" data-tab="cards" aria-selected="false">Cards</button>
  </nav>
</header>
<main><div class="wrap" id="view"></div></main>
<input type="file" id="camIn" accept="image/*" capture="environment" class="sr" aria-label="Take a photo">
<input type="file" id="picIn" accept="image/*" class="sr" aria-label="Choose a photo">
<input type="file" id="restoreIn" accept=".json,application/json" class="sr" aria-label="Choose a backup file">
<div class="busy" id="busy" hidden><span id="busyText">Reading cards…</span></div>
<div class="toast" id="toast" hidden></div>

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const fmtDay = iso => { const d = new Date(iso + "T12:00:00"); return { dow: d.toLocaleDateString(undefined, { weekday: "short" }), day: d.getDate(), long: d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" }) }; };
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 2600); }
function busy(on, text) { $("#busy").hidden = !on; if (text) $("#busyText").textContent = text; }
function classList() { return Object.values(S.classes).sort((a, b) => (a.order || 99) - (b.order || 99)); }
function curClass() { return S.classes[S.cls] || null; }
function students(c = curClass()) { return (c?.students || []).slice().sort((a, b) => a.card - b.card); }
function setsOfClass() { return Object.values(S.sets).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.created || 0) - (a.created || 0)); }

// Score one set for one student: {correct, answered, graded}
function scoreSet(set, sid) {
  let correct = 0, graded = 0, answered = 0;
  (set.questions || []).forEach((q, i) => {
    const qa = set.answers?.[i] || {};
    if (!Object.keys(qa).length) return;          // not asked/scanned yet: leave it out
    const a = qa[sid];
    if (a) answered++;
    if (q.correct && q.correct !== "ANY") { graded++; if (a === q.correct) correct++; }
    else if (q.correct === "ANY" && a) { /* survey: participation only */ }
  });
  return { correct, graded, answered };
}
function setPct(set) {
  let c = 0, g = 0; const sts = students();
  for (const st of sts) { const s = scoreSet(set, st.id); if (s.answered) { c += s.correct; g += s.graded; } }
  return g ? Math.round(100 * c / g) : null;
}
function qProgress(set, i) { const n = students().length; if (!n) return 0; const a = set.answers?.[i] || {}; return students().filter(s => a[s.id]).length / n; }

// ---------- storage ----------
// Two places data can live: "cloud" = the page's account storage (owner and Editors),
// "device" = this browser only (anyone else, e.g. someone who opened a shared link).
const LKEY = "cardscan:data:v1";
let DEV = { classes: {}, sets: {} };
const clone = o => JSON.parse(JSON.stringify(o));
function devLoad() { try { return JSON.parse(localStorage.getItem(LKEY) || "null") || { classes: {}, sets: {} }; } catch { return null; } }
function devSave() {
  try { localStorage.setItem(LKEY, JSON.stringify(DEV)); return true; }
  catch { if (S.mode !== "memory") { S.mode = "memory"; setSync("Not saving"); render(); } toast("This browser won't keep data. Download a backup before closing the page."); return false; }
}
function devAvailable() { try { const k = "cardscan:probe"; localStorage.setItem(k, "1"); localStorage.removeItem(k); return true; } catch { return false; } }
const writeChains = {};
function queueWrite(path, fn) {
  const prev = writeChains[path] || Promise.resolve();
  const next = prev.then(fn).catch(e => {
    console.error(e);
    if (e?.code === "invalid_argument" || e?.code === "not_granted" || e?.code === "revoked") { goDevice(); toast("Saving on this phone instead. See the note at the top."); return; }
    toast(e?.code === "quota_exceeded" ? "Storage is full — delete old bell work sets." : "Couldn't save. Check your connection and try again.");
  });
  writeChains[path] = next; return next;
}
function goDevice() {
  if (S.mode === "device" || S.mode === "memory") return;
  if (S.unsubSets) { S.unsubSets(); S.unsubSets = null; }
  if (S.unsubClasses) { S.unsubClasses(); S.unsubClasses = null; }
  const saved = devAvailable() ? devLoad() : null;
  S.mode = saved ? "device" : "memory";
  DEV = saved || { classes: {}, sets: {} };
  // keep anything already typed this visit
  for (const c of Object.values(S.classes)) if ((c.students || []).length || !DEV.classes[c.id]) DEV.classes[c.id] = clone(c);
  if (Object.keys(S.sets).length) DEV.sets[S.cls] = { ...(DEV.sets[S.cls] || {}), ...clone(S.sets) };
  if (S.mode === "device") devSave();
  loadDeviceClasses(); subscribeSets();
  setSync(S.mode === "device" ? "Saved on this phone" : "Not saving");
  render();
}
function loadDeviceClasses() {
  const next = {};
  for (const c of DEFAULT_CLASSES) next[c.id] = { ...c, students: [] };
  for (const [id, c] of Object.entries(DEV.classes || {})) next[id] = { ...next[id], ...clone(c), id };
  S.classes = next; S.loaded = true;
  if (!S.classes[S.cls]) S.cls = "math8";
}
function saveClass(c) {
  S.classes[c.id] = c; render();
  if (S.mode === "cloud") { const body = clone(c); return queueWrite("classes/" + c.id, () => S.db.doc("classes/" + c.id).set(body)); }
  if (S.mode === "device") { DEV.classes[c.id] = clone(c); devSave(); }
}
function saveSet(set) {
  set.updated = Date.now(); S.sets[set.id] = set; render();
  if (S.mode === "cloud") { const body = clone(set), path = `classes/${S.cls}/sets/${set.id}`; return queueWrite(path, () => S.db.doc(path).set(body)); }
  if (S.mode === "device") { (DEV.sets[S.cls] ||= {})[set.id] = clone(set); devSave(); }
}
function deleteSet(set) {
  delete S.sets[set.id]; S.openSet = null; render();
  if (S.mode === "cloud") { const path = `classes/${S.cls}/sets/${set.id}`; queueWrite(path, () => S.db.doc(path).delete()); }
  if (S.mode === "device") { if (DEV.sets[S.cls]) delete DEV.sets[S.cls][set.id]; devSave(); }
}
function subscribeSets() {
  if (S.unsubSets) { S.unsubSets(); S.unsubSets = null; }
  S.sets = {}; S.setsFor = S.cls;
  if (S.mode === "device") { S.sets = clone(DEV.sets[S.cls] || {}); return; }
  if (S.mode !== "cloud") return;
  S.unsubSets = S.db.collection(`classes/${S.cls}/sets`).onSnapshot(snap => {
    const next = {};
    for (const d of snap.docs) next[d.id] = { ...clone(d.data()), id: d.id };
    S.sets = next; render();
  }, e => { console.error(e); setSync("Sync stopped — reload to reconnect"); });
}
function setSync(t) { $("#sync").textContent = t; }

async function boot() {
  for (const c of DEFAULT_CLASSES) S.classes[c.id] = { ...c, students: [] };
  render();
  const use = n => window.claude?.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null);
  const [db, downloads, user] = await Promise.all([use("db"), use("downloads"), use("user")]);
  S.downloads = downloads;
  let cloudOK = !!db;
  if (db && user) { try { cloudOK = await user.canEdit(); } catch { cloudOK = true; } }
  if (!cloudOK) { S.mode = "cloud-pending"; goDevice(); return; }
  S.mode = "cloud"; S.db = db;
  const timer = setTimeout(() => { if (!S.loaded) { setSync("Can't reach saved data yet"); } }, 10000);
  S.unsubClasses = db.collection("classes").onSnapshot(snap => {
    clearTimeout(timer);
    const next = {};
    for (const c of DEFAULT_CLASSES) next[c.id] = { ...c, students: [] };
    for (const d of snap.docs) next[d.id] = { ...next[d.id], ...clone(d.data()), id: d.id };
    S.classes = next; S.loaded = true;
    setSync(snap.metadata.fromCache ? "Saved (syncing…)" : "Saved to your account");
    if (!S.classes[S.cls]) S.cls = "math8";
    render();
  }, e => { console.error(e); clearTimeout(timer); setSync("Sync stopped — reload to reconnect"); });
  subscribeSets();
}

// ---------- backup ----------
async function buildBackup() {
  const out = { app: "stcs-card-scan", version: 1, exported: new Date().toISOString(), classes: {}, sets: {} };
  for (const c of Object.values(S.classes)) out.classes[c.id] = clone(c);
  if (S.mode === "cloud") {
    for (const id of Object.keys(S.classes)) {
      const snap = await S.db.collection(`classes/${id}/sets`).get();
      out.sets[id] = {}; for (const d of snap.docs) out.sets[id][d.id] = { ...clone(d.data()), id: d.id };
    }
  } else {
    out.sets = clone(DEV.sets || {});
    out.sets[S.cls] = { ...(out.sets[S.cls] || {}), ...clone(S.sets) };
  }
  return out;
}
async function downloadBackup() {
  try {
    busy(true, "Making backup…");
    const b = await buildBackup(); const text = JSON.stringify(b);
    busy(false);
    if (S.downloads) return offerFile(`STCS_Card_Scan_backup_${todayISO()}.json`, text);
    S.backupText = text; render(); toast("Copy the backup text below and save it somewhere safe.");
  } catch (e) { busy(false); console.error(e); toast("Couldn't make the backup. Try again."); }
}
async function readRestore(file) {
  if (!file) return;
  try {
    const b = JSON.parse(await file.text());
    if (b?.app !== "stcs-card-scan" || !b.classes) throw new Error();
    S.restore = b; render();
  } catch { toast("That file isn't a Card Scan backup."); }
}
async function applyRestore() {
  const b = S.restore; if (!b) return;
  S.restore = null; busy(true, "Restoring…");
  try {
    if (S.mode === "cloud") {
      for (const [id, c] of Object.entries(b.classes)) { const body = clone(c); delete body.id; await queueWrite("classes/" + id, () => S.db.doc("classes/" + id).set(body)); }
      for (const [cid, sets] of Object.entries(b.sets || {})) for (const [sid, s] of Object.entries(sets)) { const body = clone(s); delete body.id; const path = `classes/${cid}/sets/${sid}`; await queueWrite(path, () => S.db.doc(path).set(body)); }
    } else {
      for (const [id, c] of Object.entries(b.classes)) DEV.classes[id] = clone(c);
      for (const [cid, sets] of Object.entries(b.sets || {})) DEV.sets[cid] = { ...(DEV.sets[cid] || {}), ...clone(sets) };
      if (S.mode === "device") devSave();
      loadDeviceClasses();
    }
    subscribeSets(); toast("Backup restored");
  } catch (e) { console.error(e); toast("Restore stopped partway. Try again."); }
  finally { busy(false); render(); }
}

// ---------- card detection ----------
let detector = null;
function getDetector() {
  if (!window.AR) throw new Error("The card reader didn't load. Check your connection and reload the page.");
  if (!detector) { AR.DICTIONARIES.STCS_CARDS = { nBits: 16, tau: 2, codeList: CODES }; detector = new AR.Detector({ dictionaryName: "STCS_CARDS", maxHammingDistance: 2 }); }
  return detector;
}
// Which letter is on top: angle of the card's A edge, measured from straight up.
function readAngle(c) {
  const cx = (c[0].x + c[1].x + c[2].x + c[3].x) / 4, cy = (c[0].y + c[1].y + c[2].y + c[3].y) / 4;
  const mx = (c[0].x + c[1].x) / 2 - cx, my = (c[0].y + c[1].y) / 2 - cy;
  return Math.atan2(mx, -my) * 180 / Math.PI;
}
function angleToLetter(ang, turn = 0) {
  const k = Math.round(ang / 90), dev = Math.abs(ang - k * 90);
  if (dev > 32) return null;
  const q = (((k + turn) % 4) + 4) % 4;
  return ["A", "D", "C", "B"][q];
}
function detectMulti(canvas) {
  const det = getDetector(), W = canvas.width, H = canvas.height, best = {};
  for (const f of [1, 0.5, 0.25]) {
    const w = Math.round(W * f), h = Math.round(H * f);
    if (Math.min(w, h) < 300) break;
    let data;
    if (f === 1) data = canvas.getContext("2d").getImageData(0, 0, w, h);
    else { const c = document.createElement("canvas"); c.width = w; c.height = h; const x = c.getContext("2d", { willReadFrequently: true }); x.drawImage(canvas, 0, 0, w, h); data = x.getImageData(0, 0, w, h); }
    for (const m of det.detect(data)) {
      if (m.id < 0 || m.id >= MAX_CARDS) continue;
      const side = Math.hypot(m.corners[0].x - m.corners[1].x, m.corners[0].y - m.corners[1].y);
      const score = m.hammingDistance * 100 + Math.abs(Math.log(side / 80));
      if (!best[m.id] || score < best[m.id].score) best[m.id] = { score, card: m.id + 1, corners: m.corners.map(p => ({ x: p.x / f, y: p.y / f })) };
    }
  }
  return Object.values(best).map(m => ({ card: m.card, corners: m.corners, angle: readAngle(m.corners) }));
}
async function fileToCanvas(file) {
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: "from-image" }); }
  catch { src = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error("That file isn't a photo this page can read.")); im.src = URL.createObjectURL(file); }); }
  const w0 = src.width, h0 = src.height, k = Math.min(1, 4200 / Math.max(w0, h0));
  const c = document.createElement("canvas"); c.width = Math.round(w0 * k); c.height = Math.round(h0 * k);
  c.getContext("2d", { willReadFrequently: true }).drawImage(src, 0, 0, c.width, c.height);
  return c;
}
async function handlePhoto(file) {
  const set = S.sets[S.openSet]; if (!file || !set) return;
  busy(true, "Reading cards…");
  await new Promise(r => setTimeout(r, 40));
  try {
    const canvas = await fileToCanvas(file);
    await new Promise(r => setTimeout(r, 10));
    const found = detectMulti(canvas);
    const byCard = Object.fromEntries(students().map(s => [s.card, s]));
    const scan = { q: S.q, turn: 0, items: found, canvas, at: Date.now() };
    S.lastScan = scan;
    applyScan(set, scan);
  } catch (e) { console.error(e); toast(e.message || "Couldn't read that photo."); }
  finally { busy(false); }
}
function applyScan(set, scan, prevTurn = null) {
  const byCard = Object.fromEntries(students().map(s => [s.card, s]));
  const qa = { ...(set.answers?.[scan.q] || {}) };
  const tilted = [], unknown = [];
  let read = 0;
  for (const it of scan.items) {
    const st = byCard[it.card];
    if (prevTurn !== null && st && qa[st.id] === angleToLetter(it.angle, prevTurn)) delete qa[st.id];
    const L = angleToLetter(it.angle, scan.turn);
    if (!st) { unknown.push(it.card); continue; }
    if (!L) { tilted.push(st.name); continue; }
    qa[st.id] = L; read++;
  }
  scan.summary = { read, tilted, unknown, total: scan.items.length };
  set.answers = { ...(set.answers || {}), [scan.q]: qa };
  saveSet(set);
}

// ---------- downloads ----------
async function offerFile(filename, data) {
  if (!S.downloads) { toast("Downloads need a signed-in claude.ai account in this view."); return; }
  try { await S.downloads.save({ filename, data }); toast("Saved " + filename); }
  catch (e) { if (e?.code !== "declined") toast(e?.code === "rate_limited" ? "A save is already waiting — try again in a moment." : "Couldn't save the file."); }
}
function csvCell(v) { const s = String(v ?? ""); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }
function toCSV(rows) { return rows.map(r => r.map(csvCell).join(",")).join("\r\n"); }

// ---------- rendering ----------
function render() {
  // chips
  const chips = $("#chips");
  chips.innerHTML = classList().map(c => `<button class="chip" data-cls="${c.id}" aria-pressed="${c.id === S.cls}"><i style="background:var(${c.color || "--c8"})"></i>${esc(c.name)}</button>`).join("");
  for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === S.tab));
  const v = $("#view");
  const keepScroll = window.scrollY;
  if (S.tab === "sets") v.innerHTML = S.openSet && S.sets[S.openSet] ? viewSet() : (S.newSet ? viewNewSet() : viewSets());
  else if (S.tab === "roster") v.innerHTML = viewRoster();
  else if (S.tab === "reports") v.innerHTML = viewReports();
  else v.innerHTML = viewCards();
  if (S.tab === "sets" && S.openSet && S.lastScan && S.lastScan.q === S.q) drawPreview();
  window.scrollTo(0, keepScroll);
}
function banner() {
  if (S.mode === "device") return `<div class="note"><b>Saving on this phone only.</b> Rosters and scores stay in this browser. Use the same phone and browser each time, and download a backup each week on the Cards tab.</div>`;
  if (S.mode === "memory") return `<div class="note"><b>Not saving.</b> This browser is blocking storage (a private window, maybe). Download a backup on the Cards tab before you close the page.</div>`;
  return "";
}

function viewSets() {
  const c = curClass(), list = setsOfClass(), n = students().length;
  const items = list.map(s => {
    const d = fmtDay(s.date || todayISO()), p = setPct(s);
    const done = (s.questions || []).filter((_, i) => qProgress(s, i) > 0).length;
    return `<button class="setitem" data-open="${s.id}">
      <div class="datebox"><div class="d">${esc(d.dow)}</div><div class="n">${d.day}</div></div>
      <div><div class="t">${esc(s.title || "Bell work")}</div><div class="m">${(s.questions || []).length} questions · ${done} scanned</div></div>
      <div class="pct">${p === null ? "—" : p + "%"}<small>class avg</small></div></button>`;
  }).join("");
  return `${banner()}
  <div class="row spread"><div><h2>${esc(c?.name || "")} bell work</h2><p class="sub">${n} student${n === 1 ? "" : "s"} on the roster</p></div>
  <button class="btn primary" data-act="newset">+ New set</button></div>
  ${n === 0 ? `<div class="note info">Add your students on the <b>Roster</b> tab first, so scanned cards match names.</div>` : ""}
  ${list.length ? `<div class="setlist">${items}</div>` : `<div class="panel empty"><b>No bell work yet</b><span>Make a set for today: choose how many questions and the correct letters. Then scan the room for each question.</span><button class="btn primary" data-act="newset">+ New set</button></div>`}`;
}

        <button class="btn" data-act="nsparse">Fill in from pasted text</button>
      </div></details>
  </div>

  <button class="scanbtn" data-act="nssave">Save set</button>

const CAM = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.6"/></svg>`;
function viewSet() {

  const d = fmtDay(set.date || todayISO());
  const pills = qs.map((x, i) => `<button class="qpill" data-act="q" data-i="${i}" aria-pressed="${i === S.q}">Q${i + 1}<span class="bar"><span style="width:${Math.round(qProgress(set, i) * 100)}%"></span></span></button>`).join("");
  const sm = S.lastScan && S.lastScan.q === S.q ? S.lastScan.summary : null;

      <b>Read ${sm.read} card${sm.read === 1 ? "" : "s"}</b> from this photo.

  return `<div class="row spread"><button class="btn ghost sm" data-act="back">← All sets</button>
    <div class="row"><button class="btn sm" data-act="editset">${S.editing ? "Done" : "Edit"}</button></div></div>

function drawPreview() {
  const cv = $("#preview"), sc = S.lastScan; if (!cv || !sc?.canvas) return;
  const k = Math.min(1, 900 / sc.canvas.width); cv.width = Math.round(sc.canvas.width * k); cv.height = Math.round(sc.canvas.height * k);
  const x = cv.getContext("2d"); x.drawImage(sc.canvas, 0, 0, cv.width, cv.height);
  const byCard = Object.fromEntries(students().map(s => [s.card, s]));
  const set = S.sets[S.openSet]; const correct = set?.questions?.[sc.q]?.correct;
  for (const it of sc.items) {
    const L = angleToLetter(it.angle, sc.turn), st = byCard[it.card];
    const col = !st || !L ? "#f3c623" : correct === "ANY" || !correct ? "#4aa3ff" : L === correct ? "#2ecc71" : "#ff5a3c";
    x.lineWidth = Math.max(2, cv.width / 300); x.strokeStyle = col; x.beginPath();
    it.corners.forEach((p, i) => (i ? x.lineTo : x.moveTo).call(x, p.x * k, p.y * k)); x.closePath(); x.stroke();
    const cxp = it.corners.reduce((a, p) => a + p.x, 0) / 4 * k, cyp = it.corners.reduce((a, p) => a + p.y, 0) / 4 * k;
    const label = (st ? st.name.split(" ")[0] : "#" + it.card) + " " + (L || "?");
    x.font = `bold ${Math.max(12, cv.width / 55)}px system-ui, sans-serif`; const w = x.measureText(label).width;
    x.fillStyle = "rgba(0,0,0,.7)"; x.fillRect(cxp - w / 2 - 4, cyp - 12, w + 8, 22); x.fillStyle = col; x.textAlign = "center"; x.textBaseline = "middle"; x.fillText(label, cxp, cyp);
  }
}

function weekBounds(offset = 0) {
  const d = new Date(todayISO() + "T12:00:00"); const dow = (d.getDay() + 6) % 7; d.setDate(d.getDate() - dow + offset * 7);
  const iso = x => { const y = new Date(x); y.setMinutes(y.getMinutes() - y.getTimezoneOffset()); return y.toISOString().slice(0, 10); };
  const end = new Date(d); end.setDate(end.getDate() + 6); return [iso(d), iso(end)];
}
function reportSets() {
  const all = setsOfClass().slice().reverse(); const r = S.report;
  if (r.range === "pick" && r.chosen) return all.filter(s => r.chosen.includes(s.id));
  if (r.range === "all") return all;
  const [a, b] = weekBounds(r.range === "last" ? -1 : 0);
  return all.filter(s => s.date >= a && s.date <= b);
}

function parsePaste(txt) {
  const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
  const out = []; let cur = null;
  for (const l of lines) {
    const q = l.match(/^(\d+)[.)]\s+(.*)$/); const c = l.match(/^correct\s*[:=]?\s*([ABCD])\b/i);
    if (q) { cur = { text: q[2].trim(), correct: "" }; out.push(cur); }
    else if (c && cur) cur.correct = c[1].toUpperCase();
  }
  if (out.length) return out;
  const letters = txt.toUpperCase().match(/\b[ABCD]\b/g);
  return letters ? letters.map(L => ({ text: "", correct: L })) : [];
}
async function exportCSV(detail) {
  const sets = reportSets(), sts = students(), c = curClass();
  if (!sets.length || !sts.length) { toast("Nothing to export in this range."); return; }
  let rows;
  if (!detail) {
    rows = [["Student", "Card", ...sets.map(s => `${s.date} ${s.title}`), "Overall %", "Points /10"]];
    for (const st of sts) { let cc = 0, g = 0; const cells = sets.map(s => { const x = scoreSet(s, st.id); if (!x.answered) return "absent"; cc += x.correct; g += x.graded; return x.graded ? `${x.correct}/${x.graded}` : "participated"; }); const p = g ? Math.round(100 * cc / g) : ""; rows.push([st.name, st.card, ...cells, p, p === "" ? "" : (p / 10).toFixed(1)]); }
  } else {
    rows = [["Date", "Set", "Question", "Correct answer", "Student", "Card", "Answer", "Result"]];
    for (const s of sets) (s.questions || []).forEach((q, i) => { for (const st of sts) { const a = s.answers?.[i]?.[st.id] || ""; rows.push([s.date, s.title, `Q${i + 1}${q.text ? ": " + q.text : ""}`, q.correct === "ANY" ? "survey" : q.correct, st.name, st.card, a, !a ? "no answer" : q.correct === "ANY" ? "participated" : q.correct ? (a === q.correct ? "correct" : "incorrect") : ""]); } });
  }
  const name = `${(c?.name || "class").replace(/[^A-Za-z0-9]+/g, "_")}_${detail ? "answers" : "scores"}_${todayISO()}.csv`;
  offerFile(name, toCSV(rows));
}

boot();
</script>
